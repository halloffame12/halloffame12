<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">
  <rect x="0" y="0" width="720" height="300" rx="16" fill="#0d1117"/>
  <rect x="0" y="0" width="720" height="40" rx="16" fill="#161b22"/>
  <rect x="0" y="20" width="720" height="20" fill="#161b22"/>
  <circle cx="28" cy="20" r="6.5" fill="#ff5f57"/>
  <circle cx="52" cy="20" r="6.5" fill="#febc2e"/>
  <circle cx="76" cy="20" r="6.5" fill="#28c840"/>
  <text x="360" y="26" text-anchor="middle" font-size="13" fill="#8b949e">sumit@github: ~/open-source</text>
  <rect x="0.75" y="0.75" width="718.5" height="298.5" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.1s" fill="freeze"/>
    <text x="32" y="64" font-size="14" fill="#58a6ff">$ gh oss --status</text>
  </g>

  <g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.5s" fill="freeze"/>
      <rect x="32" y="84" width="155" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="32" y="84" width="155" height="3" rx="1.5" fill="#58a6ff">
        <animate attributeName="width" from="0" to="155" dur="0.5s" begin="0.6s" fill="freeze"/>
      </rect>
      <text x="109.5" y="132" text-anchor="middle" font-size="30" font-weight="bold" fill="#58a6ff">341</text>
      <text x="109.5" y="156" text-anchor="middle" font-size="10" fill="#8b949e">COMMITS · THIS YEAR</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.75s" fill="freeze"/>
      <rect x="199" y="84" width="155" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="199" y="84" width="155" height="3" rx="1.5" fill="#a371f7">
        <animate attributeName="width" from="0" to="155" dur="0.5s" begin="0.85s" fill="freeze"/>
      </rect>
      <text x="276.5" y="132" text-anchor="middle" font-size="30" font-weight="bold" fill="#a371f7">4</text>
      <text x="276.5" y="156" text-anchor="middle" font-size="10" fill="#8b949e">PULL REQUESTS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.0s" fill="freeze"/>
      <rect x="366" y="84" width="155" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="366" y="84" width="155" height="3" rx="1.5" fill="#39d353">
        <animate attributeName="width" from="0" to="155" dur="0.5s" begin="1.1s" fill="freeze"/>
      </rect>
      <text x="443.5" y="132" text-anchor="middle" font-size="30" font-weight="bold" fill="#39d353">67</text>
      <text x="443.5" y="156" text-anchor="middle" font-size="10" fill="#8b949e">PUBLIC REPOS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.25s" fill="freeze"/>
      <rect x="533" y="84" width="155" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="533" y="84" width="155" height="3" rx="1.5" fill="#f0883e">
        <animate attributeName="width" from="0" to="155" dur="0.5s" begin="1.35s" fill="freeze"/>
      </rect>
      <text x="610.5" y="132" text-anchor="middle" font-size="30" font-weight="bold" fill="#f0883e">4</text>
      <text x="610.5" y="156" text-anchor="middle" font-size="10" fill="#8b949e">UPSTREAM REPOS</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.6s" fill="freeze"/>
    <text x="32" y="202" font-size="13" fill="#58a6ff">$ ctx ship</text>
    <text x="139" y="202" font-size="13" fill="#e6edf3">npm · cargo · homebrew · scoop · winget</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.9s" fill="freeze"/>
    <text x="32" y="232" font-size="13" fill="#58a6ff">$ status</text>
    <text x="113" y="232" font-size="13" fill="#39d353">● ONLINE</text>
    <text x="185" y="232" font-size="13" fill="#e6edf3">building ctx + open to OSS &amp; intern collabs</text>
    <rect x="508" y="223.5" width="9" height="16" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.2s" fill="freeze"/>
    <text x="32" y="262" font-size="13" fill="#58a6ff">$ whoami</text>
    <text x="176" y="262" font-size="13" fill="#e6edf3">Sumit Chauhan — maintainer · IIT Patna · NASA Space Apps 25</text>
  </g>
</svg>