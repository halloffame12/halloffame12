<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">CTX blueprint</title><desc id="d">A blueprint-style diagram showing source files becoming a local searchable code map.</desc><rect width="1200" height="310" rx="18" fill="#17212A"/><g stroke="#B5D0B9" stroke-opacity=".16"><path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200M50 0v310M100 0v310M150 0v310M200 0v310M250 0v310M300 0v310M350 0v310M400 0v310M450 0v310M500 0v310M550 0v310M600 0v310M650 0v310M700 0v310M750 0v310M800 0v310M850 0v310M900 0v310M950 0v310M1000 0v310M1050 0v310M1100 0v310M1150 0v310"/></g><g fill="#EEDFC6" font-family="ui-monospace,monospace" text-anchor="middle"><text x="600" y="39" fill="#D3A03D" font-size="15" letter-spacing="3">CTX / WORKSHOP BLUEPRINT</text><g stroke="#D3A03D" stroke-width="2"><rect x="35" y="112" width="175" height="80" rx="8" fill="#24343B"/><rect x="255" y="112" width="175" height="80" rx="8" fill="#24343B"/><rect x="475" y="112" width="175" height="80" rx="8" fill="#24343B"/><rect x="695" y="112" width="175" height="80" rx="8" fill="#24343B"/><rect x="915" y="112" width="250" height="80" rx="8" fill="#A84D3E"/></g><text x="122" y="145" font-size="17">SOURCE FILES</text><text x="122" y="170" fill="#B5D0B9" font-size="12">folders + symbols</text><text x="342" y="145" font-size="17">TREE-SITTER</text><text x="342" y="170" fill="#B5D0B9" font-size="12">read structure</text><text x="562" y="145" font-size="17">CODE GRAPH</text><text x="562" y="170" fill="#B5D0B9" font-size="12">connect pieces</text><text x="782" y="145" font-size="17">SQLITE INDEX</text><text x="782" y="170" fill="#B5D0B9" font-size="12">keep it local</text><text x="1040" y="145" font-size="17">11 PRACTICAL TOOLS</text><text x="1040" y="170" fill="#FFF8EA" font-size="12">find the right path</text></g><g stroke="#D3A03D" stroke-width="4" fill="none"><path d="M210 152h45M430 152h45M650 152h45M870 152h45"/></g><g fill="#D3A03D"><circle cx="228" cy="152" r="5"><animate attributeName="cx" values="210;250;210" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="448" cy="152" r="5"><animate attributeName="cx" values="430;470;430" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="668" cy="152" r="5"><animate attributeName="cx" values="650;690;650" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="888" cy="152" r="5"><animate attributeName="cx" values="870;910;870" dur="2.2s" repeatCount="indefinite"/></circle></g></svg>
