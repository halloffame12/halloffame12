<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">Restaurant QR Menu platform</title><desc id="desc">A QR entry point leads to a public menu, order, and restaurant operations API.</desc><rect width="1200" height="220" rx="16" fill="#111816"/><text x="42" y="42" fill="#b9ff4a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">RESTAURANT QR MENU / PRODUCT SYSTEM</text><g fill="#eaf2e4"><rect x="80" y="91" width="100" height="100" rx="8"/><path d="M101 112h18v18h-18zM139 112h18v18h-18zM101 150h18v18h-18zM139 150h18v18h-18z" fill="#111816"/><path d="M180 141h160" stroke="#b9ff4a" stroke-width="4" stroke-dasharray="2 10"/></g><g fill="#d9e8ca"><rect x="390" y="91" width="200" height="100" rx="8"/><rect x="650" y="91" width="200" height="100" rx="8"/><rect x="910" y="91" width="200" height="100" rx="8"/></g><g fill="#111816" font-family="ui-monospace,monospace" text-anchor="middle"><text x="490" y="130" font-size="16">PUBLIC MENU</text><text x="490" y="157" fill="#527b35" font-size="12">items + modifiers</text><text x="750" y="130" font-size="16">ORDER FLOW</text><text x="750" y="157" fill="#527b35" font-size="12">tables + sessions</text><text x="1010" y="130" font-size="16">API + DB</text><text x="1010" y="157" fill="#527b35" font-size="12">Fastify + PostgreSQL</text></g></svg>
