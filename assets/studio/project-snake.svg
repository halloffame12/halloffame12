<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">Snake reinforcement learning experiment</title><desc id="desc">A simple reinforcement learning loop observes state, chooses an action, receives reward, and updates policy.</desc><rect width="1200" height="220" rx="16" fill="#f3f6e9"/><text x="42" y="42" fill="#527b35" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">SNAKE / REINFORCEMENT LEARNING EXPERIMENT</text><g font-family="ui-monospace,monospace" text-anchor="middle"><g fill="#193329"><rect x="62" y="92" width="185" height="68" rx="8"/><text x="154" y="122" fill="#eaf2e4" font-size="16">STATE</text><text x="154" y="145" fill="#b9ff4a" font-size="12">danger + food + direction</text></g><g fill="#e65d3f"><rect x="300" y="92" width="185" height="68" rx="8"/><text x="392" y="122" fill="#fff5ed" font-size="16">ACTION</text><text x="392" y="145" fill="#fff5ed" font-size="12">left / straight / right</text></g><g fill="#3ec7db"><rect x="538" y="92" width="185" height="68" rx="8"/><text x="630" y="122" fill="#102b31" font-size="16">REWARD</text><text x="630" y="145" fill="#164b55" font-size="12">survive · eat · crash</text></g><g fill="#b9ff4a"><rect x="776" y="92" width="185" height="68" rx="8"/><text x="868" y="122" fill="#193329" font-size="16">UPDATE</text><text x="868" y="145" fill="#35551f" font-size="12">learn the next move</text></g></g><g stroke="#527b35" stroke-width="3"><path d="M247 126h53M485 126h53M723 126h53M961 126h120"/></g><path d="M1080 126l-12-8v16z" fill="#527b35"/></svg>
