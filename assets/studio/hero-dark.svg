<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sumit Chauhan — engineering field notes</title>
  <desc id="desc">A dark editorial poster with a lime index mark, a code graph, and Sumit's name.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe7db" stroke-opacity=".08"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#05080a" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="360" rx="20" fill="#111816"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <path d="M0 282h1200" stroke="#b9ff4a" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="58" y="52" width="510" height="180" rx="12" fill="#eaf2e4"/>
    <path d="M88 86h190M88 103h250M88 120h130" stroke="#344239" stroke-width="5" stroke-linecap="round"/>
    <text x="88" y="177" fill="#111816" font-family="Georgia,serif" font-size="54" font-weight="700">SUMIT</text>
    <text x="88" y="215" fill="#e65d3f" font-family="Georgia,serif" font-size="34" font-weight="700">CHAUVAN</text>
  </g>
  <g fill="none" stroke="#b9ff4a" stroke-width="3">
    <path d="M1012 78l92 66-92 66M1104 144l50-70"/>
    <circle cx="1012" cy="78" r="7" fill="#e65d3f"/><circle cx="1104" cy="144" r="7" fill="#b9ff4a"/><circle cx="1012" cy="210" r="7" fill="#3ec7db"/><circle cx="1154" cy="74" r="7" fill="#e65d3f"/>
  </g>
  <text x="650" y="78" fill="#b9ff4a" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3">FIELD NOTE / 001</text>
  <text x="650" y="122" fill="#eaf2e4" font-family="Georgia,serif" font-size="32">software with a point of view.</text>
  <text x="650" y="165" fill="#a9bdb0" font-family="ui-monospace,monospace" font-size="15">rust · products · open source · good systems</text>
  <text x="650" y="220" fill="#eaf2e4" font-family="ui-monospace,monospace" font-size="13">DELHI / IIT PATNA / BUILDING IN PUBLIC</text>
  <g fill="#b9ff4a"><circle cx="650" cy="302" r="5"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="672" cy="302" r="3"/><circle cx="689" cy="302" r="4"/></g>
  <text x="715" y="308" fill="#a9bdb0" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">OPEN / CURIOUS / ITERATING</text>
</svg>
