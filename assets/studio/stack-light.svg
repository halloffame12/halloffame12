<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="t d"><title id="t">Technical drawers</title><desc id="d">Four horizontal drawers for languages, product, data and daily tools.</desc><rect x="6" y="6" width="1188" height="178" fill="#101113"/><g font-family="ui-monospace,monospace"><g fill="#F0EEE8"><text x="36" y="45" font-size="13" letter-spacing="2">LANGUAGES</text><text x="36" y="86" font-family="Georgia,serif" font-size="21">Rust · TypeScript · Python</text><text x="36" y="122" font-family="Georgia,serif" font-size="21">Dart · C++ · Go</text><text x="36" y="157" fill="#A3A6A8" font-size="12">write close to the metal</text><text x="338" y="45" font-size="13" letter-spacing="2">PRODUCT</text><text x="338" y="86" font-family="Georgia,serif" font-size="21">React · Flutter · Node.js</text><text x="338" y="122" font-family="Georgia,serif" font-size="21">Fastify · Socket.IO</text><text x="338" y="157" fill="#A3A6A8" font-size="12">shape the thing people touch</text><text x="650" y="45" font-size="13" letter-spacing="2">DATA</text><text x="650" y="86" font-family="Georgia,serif" font-size="21">PostgreSQL · SQLite</text><text x="650" y="122" font-family="Georgia,serif" font-size="21">Firebase · tree-sitter</text><text x="650" y="157" fill="#A3A6A8" font-size="12">keep the structure honest</text><text x="910" y="45" font-size="13" letter-spacing="2">DAILY TOOLS</text><text x="910" y="86" font-family="Georgia,serif" font-size="21">Linux · Git · Docker</text><text x="910" y="122" font-family="Georgia,serif" font-size="21">VS Code · open tabs</text><text x="910" y="157" fill="#A3A6A8" font-size="12">ship, observe, repeat</text></g><path d="M310 22v146M622 22v146M882 22v146" stroke="#C5F467" stroke-width="2"/></g></svg>
