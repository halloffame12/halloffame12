<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">AnonChat realtime communication</title><desc id="desc">A browser client and Node server route anonymous messages over Socket.IO.</desc><rect width="1200" height="220" rx="16" fill="#f3f6e9"/><text x="42" y="42" fill="#527b35" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">ANONCHAT / REALTIME COMMUNICATION</text><g stroke="#193329" stroke-width="3" fill="#d9e8ca"><rect x="70" y="82" width="230" height="90" rx="10"/><rect x="900" y="82" width="230" height="90" rx="10"/></g><g fill="#193329" font-family="Georgia,serif" text-anchor="middle"><text x="185" y="118" font-size="20">browser client</text><text x="185" y="145" font-family="ui-monospace,monospace" font-size="12">React + TypeScript</text><text x="1015" y="118" font-size="20">Node server</text><text x="1015" y="145" font-family="ui-monospace,monospace" font-size="12">Socket.IO + storage</text></g><text x="600" y="76" fill="#527b35" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">EVENTS IN / MESSAGES OUT</text><path d="M350 112h470M820 142H350" fill="none" stroke="#e65d3f" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/><g fill="#e65d3f"><circle cx="420" cy="112" r="6"/><circle cx="760" cy="142" r="6"/></g></svg>
