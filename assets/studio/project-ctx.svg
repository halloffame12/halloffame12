<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">CTX code intelligence flow</title><desc id="desc">Source files become parsed symbols, a local graph, and MCP tools.</desc><rect width="1200" height="220" rx="16" fill="#111816"/><text x="42" y="42" fill="#b9ff4a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">CTX / LOCAL CODE INTELLIGENCE</text><g font-family="ui-monospace,monospace" text-anchor="middle" font-size="15"><g fill="#eaf2e4"><rect x="42" y="82" width="190" height="72" rx="8"/><text x="137" y="112" fill="#111816">SOURCE FILES</text><text x="137" y="136" fill="#527b35" font-size="12">symbols + imports</text></g><g fill="#d9e8ca"><rect x="282" y="82" width="190" height="72" rx="8"/><text x="377" y="112" fill="#111816">TREE-SITTER</text><text x="377" y="136" fill="#527b35" font-size="12">parse structure</text></g><g fill="#f5d7cb"><rect x="522" y="82" width="190" height="72" rx="8"/><text x="617" y="112" fill="#111816">CODE GRAPH</text><text x="617" y="136" fill="#8d3828" font-size="12">dependencies + impact</text></g><g fill="#b9ff4a"><rect x="762" y="82" width="190" height="72" rx="8"/><text x="857" y="112" fill="#111816">SQLITE INDEX</text><text x="857" y="136" fill="#35551f" font-size="12">incremental + local</text></g><g fill="#3ec7db"><rect x="1002" y="82" width="156" height="72" rx="8"/><text x="1080" y="112" fill="#111816">CLI + MCP</text><text x="1080" y="136" fill="#164b55" font-size="12">context on demand</text></g></g><g stroke="#b9ff4a" stroke-width="3"><path d="M232 118h50M472 118h50M712 118h50M952 118h50"/></g><g fill="#b9ff4a"><circle cx="252" cy="118" r="4"><animate attributeName="cx" values="232;272;232" dur="2s" repeatCount="indefinite"/></circle><circle cx="492" cy="118" r="4"><animate attributeName="cx" values="472;512;472" dur="2s" repeatCount="indefinite"/></circle></g></svg>
