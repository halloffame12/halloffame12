<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">Relay offline reading and transfer</title><desc id="desc">A local library sends a verified document directly to another device.</desc><rect width="1200" height="220" rx="16" fill="#f3f6e9"/><text x="42" y="42" fill="#527b35" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">RELAY / OFFLINE-FIRST READING</text><g fill="none" stroke="#193329" stroke-width="3"><rect x="70" y="78" width="160" height="105" rx="10"/><path d="M92 105h115M92 128h90M92 151h104"/><rect x="1010" y="78" width="120" height="105" rx="10"/><path d="M1032 108h76M1032 132h54M1032 156h64"/></g><g fill="#193329" font-family="Georgia,serif"><text x="150" y="72" text-anchor="middle" font-size="17">my library</text><text x="1070" y="72" text-anchor="middle" font-size="17">your device</text></g><g fill="#e65d3f"><path d="M286 114h136l-13-12 8-8 30 25-30 25-8-8 13-12H286z"/><path d="M914 145H778l13 12-8 8-30-25 30-25 8 8-13 12h136z"/></g><g fill="#7ea72f" font-family="ui-monospace,monospace" text-anchor="middle"><rect x="470" y="82" width="260" height="94" rx="10" fill="#d9e8ca"/><text x="600" y="115" fill="#193329" font-size="16">INVITE → STREAM → VERIFY</text><text x="600" y="143" fill="#527b35" font-size="12">bounded bytes · SHA-256 · local record</text></g></svg>
