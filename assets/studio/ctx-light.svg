<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">CTX map</title><desc id="d">Source files become a local graph, SQLite index and useful navigation tools.</desc><rect width="1200" height="300" fill="#F2F0E9" stroke="#101113" stroke-width="3"/><g stroke="#101113" stroke-opacity=".1"><path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200M50 0v300M100 0v300M150 0v300M200 0v300M250 0v300M300 0v300M350 0v300M400 0v300M450 0v300M500 0v300M550 0v300M600 0v300M650 0v300M700 0v300M750 0v300M800 0v300M850 0v300M900 0v300M950 0v300M1000 0v300M1050 0v300M1100 0v300M1150 0v300"/></g><g font-family="ui-monospace,monospace" text-anchor="middle" fill="#101113"><text x="600" y="40" fill="#53616B" font-size="14" letter-spacing="3">CTX / LOCAL CODE MAP</text><g stroke="#101113" stroke-width="2"><rect x="34" y="106" width="180" height="80" fill="#C5F467"/><rect x="254" y="106" width="180" height="80" fill="#78BFE8"/><rect x="474" y="106" width="180" height="80" fill="#F2F0E9"/><rect x="694" y="106" width="180" height="80" fill="#B7A4E5"/><rect x="914" y="106" width="252" height="80" fill="#FF805C"/></g><text x="124" y="139" font-size="17">SOURCE FILES</text><text x="124" y="164" font-size="12">folders + symbols</text><text x="344" y="139" font-size="17">TREE-SITTER</text><text x="344" y="164" font-size="12">read structure</text><text x="564" y="139" font-size="17">CODE GRAPH</text><text x="564" y="164" font-size="12">connect pieces</text><text x="784" y="139" font-size="17">SQLITE INDEX</text><text x="784" y="164" font-size="12">keep it local</text><text x="1040" y="139" font-size="17">11 TOOLS</text><text x="1040" y="164" font-size="12">find the path</text></g><g stroke="#101113" stroke-width="4"><path d="M214 146h40M434 146h40M654 146h40M874 146h40"/></g><g fill="#FF805C"><circle cx="230" cy="146" r="5"><animate attributeName="cx" values="214;248;214" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="450" cy