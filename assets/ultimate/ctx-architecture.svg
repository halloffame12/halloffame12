<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">CTX architecture</title><desc id="desc">Source code flows through tree-sitter, a code graph and SQLite index into MCP tools used by AI coding agents.</desc><defs><linearGradient id="bg" x2="1"><stop stop-color="#10172A"/><stop offset="1" stop-color="#211633"/></linearGradient><linearGradient id="edge"><stop stop-color="#35D9FF"/><stop offset="1" stop-color="#FF5CA8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="300" rx="18" fill="url(#bg)"/><g font-family="ui-monospace,monospace" text-anchor="middle"><g fill="#E8EDF7"><rect x="34" y="105" width="150" height="72" rx="12" fill="#17243A" stroke="#35D9FF"/><text x="109" y="135">SOURCE CODE</text><text x="109" y="158" fill="#A3FF7A" font-size="12">repos / files</text><rect x="230" y="105" width="150" height="72" rx="12" fill="#17243A" stroke="#A78BFA"/><text x="305" y="135">TREE-SITTER</text><text x="305" y="158" fill="#A3FF7A" font-size="12">parse symbols</text><rect x="426" y="105" width="150" height="72" rx="12" fill="#17243A" stroke="#FF5CA8"/><text x="501" y="135">CODE GRAPH</text><text x="501" y="158" fill="#A3FF7A" font-size="12">relationships</text><rect x="622" y="105" width="150" height="72" rx="12" fill="#17243A" stroke="#FFAA55"/><text x="697" y="135">SQLITE INDEX</text><text x="697" y="158" fill="#A3FF7A" font-size="12">local context</text><rect x="818" y="105" width="150" height="72" rx="12" fill="#17243A" stroke="#35D9FF"/><text x="893" y="135">MCP TOOLS</text><text x="893" y="158" fill="#A3FF7A" font-size="12">11 interfaces</text><rect x="1014" y="105" width="150" height="72" rx="12" fill="#17243A" stroke="#A3FF7A"/><text x="1089" y="135">AI AGENTS</text><text x="1089" y="158" fill="#A3FF7A" font-size="12">ask / navigate</text></g><g stroke="url(#edge)" stroke-width="3" fill="none" filter="url(#glow)"><path d="M184 141h46m150 0h46m150 0h46m150 0h46m150 0h46"/></g><text x="600" y="55" fill="#35D9FF" font-size="18" letter-spacing="3">CTX // DETERMINISTIC CODE INTELLIGENCE</text></g><style>@keyframes dash{to{stroke-dashoffset:-80}}path{stroke-dasharray:10 12;animation:dash 4s linear infinite}</style></svg>
