<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">CTX workshop diagram</title><desc id="d">Source code flows through parsing, a code graph and a local SQLite index into practical navigation tools.</desc><rect width="1200" height="300" rx="18" fill="#FFF8E9"/><path d="M40 245h1120" stroke="#D18A2E" stroke-width="4"/><g font-family="Georgia,serif" text-anchor="middle" fill="#17243B"><text x="600" y="46" font-size="26" font-weight="700">how CTX turns a codebase into a map</text><g stroke="#B95D43" stroke-width="3"><rect x="40" y="105" width="170" height="76" rx="10" fill="#F1D9B3"/><rect x="260" y="105" width="170" height="76" rx="10" fill="#D6E7D7"/><rect x="480" y="105" width="170" height="76" rx="10" fill="#F4D6CF"/><rect x="700" y="105" width="170" height="76" rx="10" fill="#D8E1F0"/><rect x="920" y="105" width="220" height="76" rx="10" fill="#E4B04A"/></g><text x="125" y="137" font-size="18">SOURCE CODE</text><text x="125" y="162" font-size="13">files + symbols</text><text x="345" y="137" font-size="18">TREE-SITTER</text><text x="345" y="162" font-size="13">parse structure</text><text x="565" y="137" font-size="18">CODE GRAPH</text><text x="565" y="162" font-size="13">connect ideas</text><text x="785" y="137" font-size="18">SQLITE INDEX</text><text x="785" y="162" font-size="13">keep it local</text><text x="1030" y="137" font-size="18">11 TOOLS</text><text x="1030" y="162" font-size="13">find your way</text></g><g fill="none" stroke="#B95D43" stroke-width="4" stroke-linecap="round"><path d="M210 143h50M430 143h50M650 143h50M870 143h50"/></g><g fill="#B95D43"><circle cx="235" cy="143" r="5"><animate attributeName="cx" values="210;250;210" dur="2s" repeatCount="indefinite"/></circle><circle cx="455" cy="143" r="5"><animate attributeName="cx" values="430;470;430" dur="2s" repeatCount="indefinite"/></circle><circle cx="675" cy="143" r="5"><animate attributeName="cx" values="650;690;650" dur="2s" repeatCount="